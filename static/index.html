<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KnowledgeHub</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">

<div class="max-w-5xl mx-auto px-4 py-8">

  <header class="mb-8">
    <h1 class="text-3xl font-semibold tracking-tight">KnowledgeHub</h1>
    <p class="text-slate-500 mt-1">
      Upload text files and images. Each one is described by an AI service, then
      found by meaning rather than by filename.
    </p>
  </header>

  <!-- Upload -->
  <section class="bg-white rounded-xl shadow-sm p-5 mb-5">
    <h2 class="font-medium mb-3">Add to the knowledge base</h2>
    <div class="flex flex-wrap items-center gap-3">
      <input id="file" type="file" accept=".txt,.md,.png,.jpg,.jpeg,.webp,.gif"
             class="flex-1 min-w-[16rem] text-sm text-slate-600 file:mr-3 file:py-2 file:px-4
                    file:rounded-lg file:border-0 file:text-sm file:font-medium
                    file:bg-slate-800 file:text-white hover:file:bg-slate-700 file:cursor-pointer">
      <button id="upload-btn"
              class="px-4 py-2 rounded-lg bg-slate-800 text-white text-sm font-medium
                     hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed">
        Upload
      </button>
    </div>
    <p class="text-xs text-slate-400 mt-2">
      .txt .md .png .jpg .jpeg .webp .gif &middot; up to 10 MB
    </p>
    <div id="upload-status" class="hidden mt-3 text-sm"></div>
  </section>

  <!-- Search -->
  <section class="bg-white rounded-xl shadow-sm p-5 mb-6">
    <h2 class="font-medium mb-3">Search</h2>
    <div class="flex gap-3">
      <input id="query" type="search" placeholder="black hair"
             class="flex-1 px-4 py-2 rounded-lg border border-slate-200 text-sm
                    focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-transparent">
      <button id="search-btn"
              class="px-4 py-2 rounded-lg bg-slate-800 text-white text-sm font-medium hover:bg-slate-700">
        Search
      </button>
      <button id="clear-btn"
              class="px-4 py-2 rounded-lg border border-slate-200 text-sm hover:bg-slate-50">
        Show all
      </button>
    </div>
    <div class="mt-3 flex flex-wrap gap-2 text-xs text-slate-400 items-center">
      <span>Try:</span>
      <button class="example px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600">black hair</button>
      <button class="example px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600">document</button>
      <button class="example px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600">a dog playing outside</button>
    </div>
  </section>

  <div id="summary" class="text-sm text-slate-500 mb-3"></div>
  <div id="results" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
