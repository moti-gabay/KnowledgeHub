# Render Blueprint. Makes the deployment reproducible instead of a set of
# settings typed into a dashboard.
services:
  - type: web
    name: knowledgehub
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      # sync: false means Render prompts for the value instead of storing it here.
      - key: GEMINI_API_KEY
        sync: false
    # Uploads, the SQLite file and the Chroma index survive deploys and
    # restarts. DATA_DIR already points here, so no code change is needed.
    disk:
      name: knowledgehub-data
      mountPath: /app/data
      sizeGB: 1
